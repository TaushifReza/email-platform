openapi: 3.0.3
info:
  title: Email Platform API
  version: 0.1.0
  description: API for the multi-tenant email automation platform
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness check
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /readyz:
    get:
      operationId: getReady
      summary: Readiness check
      description: Returns 200 only when the database is reachable.
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
  /auth/login:
    post:
      operationId: login
      summary: Authenticate with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credentials accepted
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Invalid credentials
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: CSRF rejected
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many attempts
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Authentication unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      responses:
        '204':
          description: Session ended
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: CSRF rejected
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/session:
    get:
      operationId: getSession
      summary: Return the authenticated session
      responses:
        '200':
          description: Session details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Accept an invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '204':
          description: Invitation accepted
        '400':
          description: Invalid or expired invitation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Password policy violation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      summary: Request a password reset link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          description: Request accepted
        '429':
          description: Too many attempts
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/password-reset/confirm:
    post:
      operationId: resetPassword
      summary: Confirm a password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
      responses:
        '204':
          description: Password reset
        '400':
          description: Invalid or expired reset link
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Password policy violation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/mfa/enroll:
    post:
      operationId: enrollMFA
      summary: Begin TOTP enrollment
      responses:
        '200':
          description: Enrollment started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFAEnrollResponse'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/mfa/enroll/confirm:
    post:
      operationId: confirmMFAEnrollment
      summary: Confirm TOTP enrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFAVerifyRequest'
      responses:
        '200':
          description: Enrollment confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFARecoveryResponse'
        '401':
          description: Invalid code
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/mfa/verify:
    post:
      operationId: verifyMFA
      summary: Complete a pending MFA challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFAVerifyRequest'
      responses:
        '204':
          description: MFA verified
        '401':
          description: Invalid code
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many attempts
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/step-up:
    post:
      operationId: stepUp
      summary: Step-up authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpRequest'
      responses:
        '204':
          description: Step-up granted
        '401':
          description: Invalid credentials
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /organization:
    get:
      operationId: getOrganization
      summary: Get organization settings
      responses:
        '200':
          description: Organization settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      operationId: updateOrganization
      summary: Update organization profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationProfileUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /organization/policy:
    patch:
      operationId: updateOrganizationPolicy
      summary: Update organization policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationPolicyUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /users:
    get:
      operationId: listUsers
      summary: List users in the organization
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /users/invitations:
    post:
      operationId: inviteUser
      summary: Invite a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteUserRequest'
      responses:
        '204':
          description: Invitation sent
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /users/{userId}:
    patch:
      operationId: updateUser
      summary: Change a user's role or deactivate
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '204':
          description: Updated
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Conflict (last owner)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /operator/session:
    get:
      operationId: getOperatorSession
      summary: Identity of the authenticated platform operator
      responses:
        '200':
          description: Operator identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorSession'
        '401':
          description: No trusted operator identity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Not a registered operator
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /operator/organizations:
    get:
      operationId: listOperatorOrganizations
      summary: List organizations
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Organizations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationList'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: createOperatorOrganization
      summary: Create an organization and its first owner invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /operator/organizations/{organizationId}/suspend:
    post:
      operationId: suspendOrganization
      summary: Suspend an organization
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Suspended
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found or wrong state
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /operator/organizations/{organizationId}/reinstate:
    post:
      operationId: reinstateOrganization
      summary: Reinstate a suspended organization
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Reinstated
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found or wrong state
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /operator/organizations/{organizationId}/limits:
    patch:
      operationId: updateOrganizationLimits
      summary: Set storage quota and sending caps
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationLimitsUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /operator/audit:
    get:
      operationId: listOperatorAudit
      summary: Operator-level audit log
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Audit entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEntryList'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
    ReadyResponse:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum: [ok, degraded]
          example: ok
        checks:
          type: object
          required:
            - db
            - redis
          properties:
            db:
              type: string
              example: ok
            redis:
              type: string
              example: disabled
    LoginRequest:
      type: object
      required:
        - email
        - password
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 1024
    LoginResponse:
      type: object
      required:
        - mfa_required
        - mfa_enrollment_required
      properties:
        mfa_required:
          type: boolean
        mfa_enrollment_required:
          type: boolean
    SessionResponse:
      type: object
      required:
        - user_id
        - organization_id
        - role
        - mfa_verified
      properties:
        user_id:
          type: string
        organization_id:
          type: string
        role:
          type: string
        mfa_verified:
          type: boolean
    AcceptInvitationRequest:
      type: object
      required:
        - token
        - password
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          maxLength: 1024
    PasswordResetRequest:
      type: object
      required:
        - email
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 254
    PasswordResetConfirm:
      type: object
      required:
        - token
        - password
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          maxLength: 1024
    Organization:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        defaultSenderName:
          type: string
        defaultReplyTo:
          type: string
        timeZone:
          type: string
        status:
          type: string
        requireApproval:
          type: boolean
        retentionDays:
          type: integer
        storageQuotaBytes:
          type: integer
          format: int64
        capsEnabled:
          type: boolean
        dailyEmailCap:
          type: integer
        campaignRecipientCap:
          type: integer
    OrganizationProfileUpdate:
      type: object
      properties:
        name:
          type: string
        defaultSenderName:
          type: string
        defaultReplyTo:
          type: string
        timeZone:
          type: string
    OrganizationPolicyUpdate:
      type: object
      properties:
        requireApproval:
          type: boolean
        retentionDays:
          type: integer
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        displayName:
          type: string
        role:
          type: string
        status:
          type: string
    UserList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        meta:
          type: object
          properties:
            nextCursor:
              type: string
            hasMore:
              type: boolean
    InviteUserRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
        role:
          type: string
    UpdateUserRequest:
      type: object
      properties:
        role:
          type: string
        deactivate:
          type: boolean
    OperatorSession:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: string
        email:
          type: string
        role:
          type: string
    OrganizationList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        meta:
          type: object
          properties:
            hasMore:
              type: boolean
    CreateOrganizationRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        defaultSenderName:
          type: string
        defaultReplyTo:
          type: string
        timeZone:
          type: string
    OrganizationLimitsUpdate:
      type: object
      required: [storageQuotaBytes, capsEnabled]
      properties:
        storageQuotaBytes:
          type: integer
          format: int64
        capsEnabled:
          type: boolean
        dailyEmailCap:
          type: integer
        campaignRecipientCap:
          type: integer
    AuditEntry:
      type: object
      properties:
        id:
          type: string
        actorType:
          type: string
        actorId:
          type: string
        actorRole:
          type: string
        action:
          type: string
        targetType:
          type: string
        targetId:
          type: string
        outcome:
          type: string
        sourceIp:
          type: string
        client:
          type: string
        details:
          type: object
        createdAt:
          type: string
          format: date-time
    AuditEntryList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        meta:
          type: object
          properties:
            hasMore:
              type: boolean
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - code
        - request_id
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          enum: [invalid_request, invalid_credentials, rate_limited, unavailable, internal_error, mfa_required, invalid_code, locked, csrf_rejected, forbidden, not_found, conflict, validation_failed, unauthorized]
        request_id:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    MFAVerifyRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
    MFAEnrollResponse:
      type: object
      required:
        - secret
        - otpauth_uri
      properties:
        secret:
          type: string
        otpauth_uri:
          type: string
    MFARecoveryResponse:
      type: object
      required:
        - recovery_codes
      properties:
        recovery_codes:
          type: array
          items:
            type: string
    StepUpRequest:
      type: object
      required:
        - password
        - code
      properties:
        password:
          type: string
        code:
          type: string
