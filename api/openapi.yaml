openapi: 3.0.3
info:
  title: Email Platform API
  version: 0.1.0
  description: API for the multi-tenant email automation platform
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness check
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /readyz:
    get:
      operationId: getReady
      summary: Readiness check
      description: Returns 200 only when the database is reachable.
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
  /auth/login:
    post:
      operationId: login
      summary: Authenticate with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credentials accepted
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Invalid credentials
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: CSRF rejected
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many attempts
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Authentication unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      responses:
        '204':
          description: Session ended
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: CSRF rejected
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/session:
    get:
      operationId: getSession
      summary: Return the authenticated session
      responses:
        '200':
          description: Session details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/mfa/enroll:
    post:
      operationId: enrollMFA
      summary: Begin TOTP enrollment
      responses:
        '200':
          description: Enrollment started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFAEnrollResponse'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/mfa/enroll/confirm:
    post:
      operationId: confirmMFAEnrollment
      summary: Confirm TOTP enrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFAVerifyRequest'
      responses:
        '200':
          description: Enrollment confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFARecoveryResponse'
        '401':
          description: Invalid code
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/mfa/verify:
    post:
      operationId: verifyMFA
      summary: Complete a pending MFA challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFAVerifyRequest'
      responses:
        '204':
          description: MFA verified
        '401':
          description: Invalid code
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many attempts
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/step-up:
    post:
      operationId: stepUp
      summary: Step-up authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpRequest'
      responses:
        '204':
          description: Step-up granted
        '401':
          description: Invalid credentials
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
    ReadyResponse:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum: [ok, degraded]
          example: ok
        checks:
          type: object
          required:
            - db
            - redis
          properties:
            db:
              type: string
              example: ok
            redis:
              type: string
              example: disabled
    LoginRequest:
      type: object
      required:
        - email
        - password
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 1024
    LoginResponse:
      type: object
      required:
        - mfa_required
        - mfa_enrollment_required
      properties:
        mfa_required:
          type: boolean
        mfa_enrollment_required:
          type: boolean
    SessionResponse:
      type: object
      required:
        - user_id
        - organization_id
        - role
        - mfa_verified
      properties:
        user_id:
          type: string
        organization_id:
          type: string
        role:
          type: string
        mfa_verified:
          type: boolean
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - code
        - request_id
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          enum: [invalid_request, invalid_credentials, rate_limited, unavailable, internal_error, mfa_required, invalid_code, locked, csrf_rejected, forbidden, not_found, conflict, validation_failed, unauthorized]
        request_id:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    MFAVerifyRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
    MFAEnrollResponse:
      type: object
      required:
        - secret
        - otpauth_uri
      properties:
        secret:
          type: string
        otpauth_uri:
          type: string
    MFARecoveryResponse:
      type: object
      required:
        - recovery_codes
      properties:
        recovery_codes:
          type: array
          items:
            type: string
    StepUpRequest:
      type: object
      required:
        - password
        - code
      properties:
        password:
          type: string
        code:
          type: string
