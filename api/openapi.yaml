openapi: 3.0.3
info:
  title: Email Platform API
  version: 0.1.0
  description: API for the multi-tenant email automation platform
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness check
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /readyz:
    get:
      operationId: getReady
      summary: Readiness check
      description: Returns 200 only when the database is reachable.
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
  /auth/login:
    post:
      operationId: login
      summary: Authenticate with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credentials accepted
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Authentication unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      responses:
        '204':
          description: Session ended
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/session:
    get:
      operationId: getSession
      summary: Return the authenticated session
      responses:
        '200':
          description: Session details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
    ReadyResponse:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum: [ok, degraded]
          example: ok
        checks:
          type: object
          required:
            - db
            - redis
          properties:
            db:
              type: string
              example: ok
            redis:
              type: string
              example: disabled
    LoginRequest:
      type: object
      required:
        - email
        - password
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 1024
    LoginResponse:
      type: object
      required:
        - mfa_required
      properties:
        mfa_required:
          type: boolean
    SessionResponse:
      type: object
      required:
        - user_id
        - organization_id
        - role
        - mfa_verified
      properties:
        user_id:
          type: string
        organization_id:
          type: string
        role:
          type: string
        mfa_verified:
          type: boolean
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          enum: [invalid_request, invalid_credentials, rate_limited, unavailable, internal_error]
