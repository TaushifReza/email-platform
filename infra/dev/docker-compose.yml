x-app-environment: &app-environment
  DATABASE_URL: postgres://email_app:app-dev@postgres:5432/email_platform_dev?sslmode=disable
  MIGRATION_DATABASE_URL: postgres://postgres:password@postgres:5432/email_platform_dev?sslmode=disable
  REDIS_URL: redis://redis:6379
  STORAGE_ENDPOINT: http://rustfs:9000
  STORAGE_BUCKET: email-platform
  STORAGE_ACCESS_KEY: test-access-key
  STORAGE_SECRET_KEY: test-secret-key
  MASTER_KEY: dev-only-master-key-not-for-production
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
  SMTP_TLS_MODE: "none"
  EMAIL_FROM: noreply@example.com
  APP_BASE_URL: "http://localhost:8081"
  LOG_LEVEL: info
  DEV_MODE: "true"
  OPENAPI_SPEC_PATH: /openapi.yaml
  TRUSTED_PROXY_CIDRS: "172.16.0.0/12"
  COOKIE_SECURE: "false"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: email_platform_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d email_platform_dev"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - backend

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - backend

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - backend

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ACCESS_KEY: test-access-key
      RUSTFS_SECRET_KEY: test-secret-key
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - backend

  storage-init:
    image: rustfs/rustfs:latest
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "/usr/bin/rc alias set local http://rustfs:9000 test-access-key test-secret-key && /usr/bin/rc mb --ignore-existing local/email-platform"
    restart: "no"
    networks:
      - backend

  postgres-bootstrap:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: password
    volumes:
      - ./postgres-init:/postgres-init:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "psql -h postgres -U postgres -d email_platform_dev -f /postgres-init/01-roles.sql"
    restart: "no"
    networks:
      - backend

  migrate:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args:
        SERVICE: migrate
    depends_on:
      postgres:
        condition: service_healthy
      postgres-bootstrap:
        condition: service_completed_successfully
    environment: *app-environment
    restart: "no"
    networks:
      - backend

  api:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args:
        SERVICE: api
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    environment: *app-environment
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/healthz >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - backend

  worker:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args:
        SERVICE: worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment: *app-environment
    restart: unless-stopped
    networks:
      - backend

  web:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    networks:
      - backend

  nginx:
    image: nginx:alpine
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    ports:
      - "8081:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      - backend
      - edge

volumes:
  postgres_data:
  rustfs_data:

networks:
  backend:
    driver: bridge
  edge:
    driver: bridge
