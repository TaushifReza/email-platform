events {
    worker_connections 1024;
}

http {
    # Include the default MIME types
    include       mime.types;
    default_type  application/octet-stream;

    # Use the same logging format as the standard Docker image
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    server {
        listen 80;
        server_name app.example.com;
        
        # Serve static files (placeholder for now)
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
        
        # Proxy API requests to the API service
        location /api/ {
            proxy_pass http://api:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location /u/ {
            proxy_pass http://api:8080/u/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Health check endpoints
        location /healthz {
            access_log off;
            return 200 "healthy\n";
        }
        
        location /readyz {
            access_log off;
            return 200 "ready\n";
        }
    }
    
    server {
        listen 80;
        server_name admin.example.com;
        
        # For now we'll have a basic redirect to the main app
        return 301 http://app.example.com$request_uri;
    }
}