events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        location = /docs {
            proxy_pass http://api:8080/docs;
            proxy_set_header Host $http_host;
        }

        location = /openapi.yaml {
            proxy_pass http://api:8080/openapi.yaml;
            proxy_set_header Host $http_host;
        }

        location /api/ {
            proxy_pass http://api:8080/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Never forward a client-supplied operator identity from the tenant host.
            proxy_set_header Cf-Access-Authenticated-User-Email "";
        }

        location /u/ {
            proxy_pass http://api:8080/u/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cf-Access-Authenticated-User-Email "";
        }

        location = /healthz {
            access_log off;
            set $api_upstream api:8080;
            proxy_pass http://$api_upstream/healthz;
        }

        location = /readyz {
            access_log off;
            set $api_upstream api:8080;
            proxy_pass http://$api_upstream/readyz;
        }

        location / {
            set $web_upstream web:80;
            proxy_pass http://$web_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Development stand-in for admin.<domain> behind Cloudflare Access.
    # Only this host sets the identity header; production sets it in Cloudflare
    # Access and nginx must trust only the authenticated tunnel.
    server {
        listen 80;
        server_name admin.localhost admin;

        location /api/ {
            proxy_pass http://api:8080/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cf-Access-Authenticated-User-Email "dev-operator@example.com";
        }

        location / {
            set $web_upstream web:80;
            proxy_pass http://$web_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
