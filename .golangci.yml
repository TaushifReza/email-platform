linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  staticcheck:
    checks: ["all", "-SA1019"]
  unused:
    check-exported: false
  misspell:
    locale: US

linters:
  enable-all: true
  disable:
    - cyclop
    - depguard
    - err113
    - exhaustruct
    - funlen
    - ireturn
    - mnd
    - nlreturn
    - paralleltest
    - prealloc
    - tagliatelle
    - tenv # deprecated
    - testpackage
    - usetesting
    - varnamelen
    - wrapcheck
    - wsl

run:
  tests: true

issues:
  exclude-dirs:
    - frontend
    - .next
    - out