version: "2"
sql:
  - schema: "backend/db/migrations"
    queries: "backend/db/queries"
    engine: "postgresql"
    gen:
      go:
        package: "sqlc"
        out: "backend/internal/platform/db/sqlc"
        emit_interface: false
        emit_db_tags: false
        overrides:
          - db_type: "uuid"
            go_type: "string"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "database/sql"
              type: "NullString"
          - db_type: "inet"
            go_type: "string"
          - db_type: "inet"
            nullable: true
            go_type:
              import: "database/sql"
              type: "NullString"
